<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>叫我罗城主</title>
<meta name="description" content="个人离线放置增量游戏原型（同人练习作）">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="罗城主">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="top">
    <div class="title-row">
      <h1>叫我罗城主</h1>
      <button id="btn-save" class="icon-btn" aria-label="打开存档面板">💾</button>
    </div>
    <div class="realm-row" id="realm-row" title="点击查看境界一览">
      <span class="realm-badge" id="realm">武徒</span>
      <span class="realm-next" id="realm-next"></span>
      <span class="realm-more">一览 ›</span>
    </div>
    <div class="bar"><div class="bar-fill" id="realm-bar"></div></div>
  </header>

  <section class="hero">
    <div class="energy-label">基因元能</div>
    <div class="energy" id="energy">0</div>
    <div class="energy-rate" id="rate">+0 / 秒</div>
    <button id="devour" class="devour" aria-label="吞噬">
      <span class="devour-title">吞 噬</span>
      <span class="devour-sub">每次 +<b id="click-power">1</b></span>
    </button>
  </section>

  <section class="panel">
    <h2>战力提升</h2>
    <div id="producers" class="list"></div>
  </section>

  <section class="panel">
    <h2>功法与秘宝</h2>
    <div id="upgrades" class="list"></div>
  </section>

  <section class="panel">
    <h2>离线收益</h2>
    <div id="offline-list" class="list"></div>
  </section>

  <section class="panel">
    <h2>产出统计</h2>
    <div class="stats">
      <div class="stat">
        <span class="stat-label">累计点击产出</span>
        <span class="stat-right"><b class="stat-value" id="stat-manual">0</b><i class="stat-pct" id="stat-manual-pct"></i></span>
      </div>
      <div class="stat">
        <span class="stat-label">累计自动产出</span>
        <span class="stat-right"><b class="stat-value" id="stat-auto">0</b><i class="stat-pct" id="stat-auto-pct"></i></span>
      </div>
      <div class="stat total">
        <span class="stat-label">累计产出总和</span>
        <span class="stat-right"><b class="stat-value" id="stat-total">0</b></span>
      </div>
    </div>
  </section>

  <footer class="foot">
    <span>v0.3.0</span>
    <span id="foot-offline">离线收益：最多 6 小时，效率 100%</span>
  </footer>

</div>

<!-- 离线收益弹窗 -->
<div class="modal hidden" id="offline-modal">
  <div class="modal-box">
    <h3>修行归来</h3>
    <p id="offline-text"></p>
    <button class="primary" id="offline-ok">收下</button>
  </div>
</div>

<!-- 存档弹窗 -->
<div class="modal hidden" id="save-modal">
  <div class="modal-box">
    <h3>存档</h3>
    <p class="hint">导出：复制下方存档码，粘贴到手机备忘录保存。<br>导入：把存档码粘贴进来，点「导入」。</p>
    <textarea id="save-text" spellcheck="false" autocomplete="off" placeholder="存档码会显示在这里"></textarea>
    <p class="hint" id="save-hint"></p>
    <div class="modal-actions">
      <button id="btn-export">导出</button>
      <button id="btn-copy">复制</button>
      <button id="btn-import">导入</button>
    </div>
    <div class="modal-actions">
      <button class="danger" id="btn-reset">重置游戏</button>
      <button class="primary" id="btn-close-save">关闭</button>
    </div>
  </div>
</div>

<!-- 境界一览 -->
<div class="modal hidden" id="realm-modal">
  <div class="modal-box">
    <h3>境界一览</h3>
    <div id="realm-list" class="realm-list"></div>
    <p class="hint" id="realm-close">点击空白处关闭</p>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="game.js"></script>
</body>
</html>
